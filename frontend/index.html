<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>矿井瓦斯班测台</title>
  <style>
    body { font-family: sans-serif; margin: 0; background: #1c1917; color: #f5f5f4; }
    header { display: flex; gap: 12px; align-items: center; padding: 12px 20px; background: #44403c; }
    main { max-width: 760px; margin: 20px auto; padding: 0 12px; }
    input, button, textarea { padding: 8px; margin-right: 8px; }
    textarea { width: 100%; box-sizing: border-box; font-family: monospace; }
    .alarm { color: #fca5a5; } .ok { color: #86efac; }
    #live { min-height: 1.4em; }
    table { width: 100%; border-collapse: collapse; }
    td, th { border-bottom: 1px solid #57534e; padding: 6px; text-align: left; }
  </style>
</head>
<body>
  <header>
    <strong>矿井瓦斯班测台</strong>
    <span id="who"></span>
    <a id="navImport" href="#import" hidden>批量导入</a>
    <a id="navList" href="#main" hidden>返回总表</a>
    <button id="out" hidden>退出</button>
  </header>
  <main>
    <section id="login">
      <p>检查员上报测点甲烷，达到 1% 会立刻推到已打开的页面。这不是图表看板。</p>
      <input id="user" value="gasman" />
      <input id="pass" type="password" value="gas123456" />
      <button id="go">登录</button>
      <p>gasman / gas123456 可上报；viewer / view123456 只能看</p>
    </section>
    <section id="app" hidden>
      <div id="viewMain">
        <p id="live">等待推送</p>
        <form id="form">
          <input id="site" placeholder="测点" />
          <input id="ch4" type="number" step="0.01" placeholder="甲烷 %" />
          <button>上报</button>
        </form>
        <table><thead><tr><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead><tbody id="rows"></tbody></table>
      </div>
      <div id="viewImport" hidden>
        <h2>批量导入</h2>
        <p>每行一个测点，格式为「测点名 浓度」，例如：<code>回风巷 1.4</code>。先试算看状态，确认后才整批入库；任一行测点名为空则整批作废。</p>
        <textarea id="importText" rows="8" placeholder="回风巷 1.4&#10;东翼-12 0.35"></textarea>
        <p>
          <button id="btnPreview" type="button">试算</button>
          <button id="btnConfirm" type="button" disabled>确认导入</button>
          <span id="importMsg"></span>
        </p>
        <table id="previewTable" hidden>
          <thead><tr><th>行号</th><th>测点</th><th>甲烷 %</th><th>状态</th><th>说明</th></tr></thead>
          <tbody id="previewRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
